apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-v2
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
      version: v2
  template:
    metadata:
      labels:
        app: backend
        version: v2
    spec:
      containers:
      - name: backend
        image: hashicorp/http-echo:latest
        args: ["-text=Hello from Backend v2 (Canary)"]
        ports:
        - containerPort: 5678
